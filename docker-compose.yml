# The IntraForge Pay pilot's own PostgreSQL -- the payment journal lives here, never in IntraForge's databases.
# Published on the loopback address only. The password comes from .env (generated by scripts/init_local.py).
name: ifpay-pilot

services:
  postgres:
    image: postgres:18
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: ifpay
      POSTGRES_DB: ifpay
      POSTGRES_PASSWORD: ${IFPAY_DB_PASSWORD:?run scripts/init_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ifpay -d ifpay"]
      interval: 5s
      retries: 20

volumes:
  pgdata: {}
